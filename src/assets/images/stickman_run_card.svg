<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Stickman Glacier Run 2D</title>
  <desc id="desc">Lofi the Yeti as an articulated 2D stickman vaulting across icy cliffside platforms while collecting Glacial Drops.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#061426"/>
      <stop offset="1" stop-color="#0e3154"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="480" fill="url(#sky)"/>
  <path d="M0 130 Q260 65 520 135 T960 95" fill="none" stroke="#2dd4bf" stroke-opacity=".38" stroke-width="26" filter="url(#glow)"/>
  <!-- Platforms -->
  <rect x="40" y="340" width="320" height="140" rx="12" fill="#13385c" stroke="#38bdf8" stroke-width="4"/>
  <rect x="460" y="290" width="440" height="190" rx="12" fill="#13385c" stroke="#2dd4bf" stroke-width="4"/>
  <!-- Mid-air leaping Lofi Yeti Stickman -->
  <g transform="translate(390 220) rotate(-18)">
    <path d="M-10 -12 Q-68 -24 -105 -4 Q-64 6 -14 2 Z" fill="#22d3ee"/>
    <path d="M0 -14 L-8 38 M-8 38 L-42 66 M-8 38 L38 52 M0 -4 L-36 -28 M0 -4 L46 -12" stroke="#f8fafc" stroke-width="11" stroke-linecap="round" fill="none"/>
    <circle cx="4" cy="-46" r="32" fill="#f8fafc" stroke="#22d3ee" stroke-width="4"/>
    <path d="M-18 -70 L-30 -88 M24 -70 L36 -88" stroke="#bae6fd" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="6" cy="-44" rx="21" ry="16" fill="#87c5ee"/>
    <circle cx="-2" cy="-47" r="4" fill="#061426"/><circle cx="15" cy="-47" r="4" fill="#061426"/>
  </g>
  <!-- Floating Drops & Gems -->
  <path d="M580 180 C595 205 602 222 580 236 C558 222 565 205 580 180 Z" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M665 160 C680 185 687 202 665 216 C643 202 650 185 665 160 Z" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="755,150 778,182 755,214 732,182" fill="#67e8f9" filter="url(#glow)"/>
  <text x="34" y="56" fill="#a5f3fc" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="4">2D GLACIER RUN</text>
</svg>
