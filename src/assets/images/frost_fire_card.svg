<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Frost Fire target range</title>
  <desc id="desc">A neon frost blaster arena with floating targets and a glowing central reticle.</desc>
  <defs>
    <radialGradient id="space"><stop stop-color="#263b78"/><stop offset=".55" stop-color="#0e1b45"/><stop offset="1" stop-color="#070b20"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="480" fill="url(#space)"/>
  <g fill="#a5f3fc" opacity=".7"><circle cx="100" cy="95" r="3"/><circle cx="220" cy="210" r="4"/><circle cx="850" cy="120" r="3"/><circle cx="770" cy="285" r="4"/><circle cx="610" cy="80" r="3"/></g>
  <path d="M0 410 Q230 300 480 380 T960 360V480H0Z" fill="#101c47" stroke="#3b82f6" stroke-opacity=".4" stroke-width="4"/>
  <g fill="none" stroke="#22d3ee" stroke-width="5" filter="url(#glow)">
