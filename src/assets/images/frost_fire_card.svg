  <g transform="translate(480 410)">
    <path d="M-60 0l20-52h80L60 0Z" fill="#172554" stroke="#67e8f9" stroke-width="6"/>
    <path d="M-30-52l30-48 30 48" fill="#0e7490" stroke="#a5f3fc" stroke-width="6"/>
