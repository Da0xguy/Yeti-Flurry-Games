    <circle cx="765" cy="180" r="55"/><circle cx="765" cy="180" r="22"/>
    <circle cx="610" cy="315" r="36"/><circle cx="610" cy="315" r="14"/>
  </g>
  <g fill="#f472b6" opacity=".9" filter="url(#glow)">
